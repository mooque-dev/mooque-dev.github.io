<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <filter id="s3"><feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#1C1917" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F2EFE9"/>

  <text x="80" y="68" font-size="10" letter-spacing="3" fill="#A8A29E" font-weight="500">AI-ASSISTED PROTOTYPING · CURSOR + MAGICPATTERNS</text>

  <!-- === Left: Control Panel (dark) === -->
  <rect x="60" y="92" width="620" height="760" rx="16" fill="#1A1917"/>

  <!-- Panel header -->
  <rect x="60" y="92" width="620" height="52" rx="16" fill="#242220"/>
  <rect x="60" y="120" width="620" height="24" fill="#242220"/>
  <!-- Traffic lights -->
  <circle cx="90" cy="118" r="7" fill="#C94040" opacity="0.8"/>
  <circle cx="112" cy="118" r="7" fill="#C9A040" opacity="0.8"/>
  <circle cx="134" cy="118" r="7" fill="#40A040" opacity="0.8"/>
  <text x="400" y="123" font-size="11" fill="#686460" text-anchor="middle" letter-spacing="1">PARAMETERS · FEE OPT-IN PROTOTYPE</text>

  <!-- Parameters -->
  <text x="90" y="184" font-size="10" letter-spacing="2.5" fill="#686460" font-weight="500">CONFIGURATION</text>

  <!-- Param: Donation amount -->
  <text x="90" y="214" font-size="12" fill="#A8A29E">Donation amount</text>
  <rect x="90" y="224" width="560" height="40" rx="8" fill="#242220" stroke="#383430" stroke-width="1"/>
  <text x="112" y="249" font-size="15" fill="#E8E4DE" font-weight="500">$100.00</text>
  <rect x="590" y="234" width="48" height="20" rx="4" fill="#2B4D38"/>
  <text x="614" y="249" font-size="11" fill="#A0C8A8" text-anchor="middle">USD</text>

  <!-- Param: Fee rate -->
  <text x="90" y="294" font-size="12" fill="#A8A29E">Platform fee rate</text>
  <!-- Slider track -->
  <rect x="90" y="306" width="560" height="4" rx="2" fill="#383430"/>
  <rect x="90" y="306" width="112" height="4" rx="2" fill="#4A8C5E"/>
  <circle cx="202" cy="308" r="10" fill="#4A8C5E"/>
  <text x="114" y="336" font-size="11" fill="#686460">0%</text>
  <text x="650" y="336" font-size="11" fill="#686460" text-anchor="end">10%</text>
  <text x="202" y="354" font-size="13" fill="#A0C8A8" text-anchor="middle" font-weight="600">2%</text>

  <!-- Param: Fallback variant -->
  <text x="90" y="384" font-size="12" fill="#A8A29E">Fallback control variant</text>
  <rect x="90" y="396" width="560" height="40" rx="8" fill="#242220" stroke="#383430" stroke-width="1"/>
  <text x="112" y="421" font-size="14" fill="#E8E4DE">Slider</text>
  <path d="M 616 411 L 628 411 L 622 421 Z" fill="#686460"/>

  <!-- Param: Default position -->
  <text x="90" y="466" font-size="12" fill="#A8A29E">Default slider position</text>
  <rect x="90" y="478" width="560" height="40" rx="8" fill="#242220" stroke="#383430" stroke-width="1"/>
  <text x="112" y="503" font-size="14" fill="#E8E4DE">Full fee (100%)</text>
  <path d="M 616 493 L 628 493 L 622 503 Z" fill="#686460"/>

  <!-- Param: Show tooltip toggle -->
  <text x="90" y="548" font-size="12" fill="#A8A29E">Show value tooltip</text>
  <rect x="90" y="560" width="48" height="26" rx="13" fill="#2B4D38"/>
  <circle cx="108" cy="573" r="11" fill="white"/>
  <text x="150" y="578" font-size="13" fill="#A8A29E">Enabled</text>

  <!-- Param: Donation conversion tracking -->
  <text x="90" y="618" font-size="12" fill="#A8A29E">Track conversion alongside fee opt-in</text>
  <rect x="90" y="630" width="48" height="26" rx="13" fill="#2B4D38"/>
  <circle cx="108" cy="643" r="11" fill="white"/>
  <text x="150" y="648" font-size="13" fill="#A8A29E">Enabled</text>

  <!-- Divider -->
  <line x1="90" y1="680" x2="650" y2="680" stroke="#2C2A28" stroke-width="1"/>

  <!-- Live metrics row -->
  <text x="90" y="710" font-size="10" letter-spacing="2.5" fill="#686460" font-weight="500">LIVE SIMULATION OUTPUT</text>
  <!-- Metric 1 -->
  <text x="90" y="742" font-size="11" fill="#686460">Fee opt-in rate</text>
  <text x="90" y="764" font-size="24" font-weight="700" fill="#4A8C5E">92%</text>
  <!-- Metric 2 -->
  <text x="270" y="742" font-size="11" fill="#686460">Avg fee collected</text>
  <text x="270" y="764" font-size="24" font-weight="700" fill="#E8E4DE">$1.84</text>
  <!-- Metric 3 -->
  <text x="460" y="742" font-size="11" fill="#686460">Conversion delta</text>
  <text x="460" y="764" font-size="24" font-weight="700" fill="#A8A29E">+0.2%</text>
  <!-- Status -->
  <circle cx="90" cy="808" r="5" fill="#4A8C5E"/>
  <text x="104" y="813" font-size="12" fill="#686460">Live · Variant B selected · 3 engineers reviewing</text>

  <!-- === Right: Live Preview === -->
  <rect x="740" y="92" width="800" height="760" rx="16" fill="#FFFFFF" filter="url(#s3)"/>

  <!-- Browser bar -->
  <rect x="740" y="92" width="800" height="48" rx="16" fill="#F9F7F4"/>
  <rect x="740" y="116" width="800" height="24" fill="#F9F7F4"/>
  <!-- URL bar -->
  <rect x="820" y="102" width="500" height="28" rx="14" fill="#EDE9E3"/>
  <text x="1070" y="121" font-size="12" fill="#A8A29E" text-anchor="middle">prototype.magicpatterns.com/fee-opt-in</text>
  <!-- Refresh btn -->
  <text x="786" y="121" font-size="16" fill="#A8A29E" text-anchor="middle">↺</text>

  <!-- Preview content: donation card -->
  <text x="1140" y="188" font-size="10" letter-spacing="2" fill="#A8A29E" text-anchor="middle">LIVE PREVIEW</text>

  <rect x="890" y="206" width="500" height="540" rx="14" fill="white" filter="url(#s3)"/>
  <rect x="890" y="206" width="500" height="64" rx="14" fill="#2B4D38"/>
  <rect x="890" y="246" width="500" height="24" fill="#2B4D38"/>
  <text x="1140" y="228" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.5)" text-anchor="middle">HOPE FOUNDATION</text>
  <text x="1140" y="252" font-size="13" fill="rgba(255,255,255,0.85)" text-anchor="middle">Complete your donation</text>

  <text x="914" y="298" font-size="10" letter-spacing="2" fill="#A8A29E">DONATION</text>
  <text x="914" y="336" font-size="36" font-weight="700" fill="#1C1917" letter-spacing="-1">$100.00</text>
  <line x1="914" y1="354" x2="1366" y2="354" stroke="#EDE9E3" stroke-width="1"/>

  <text x="914" y="382" font-size="10" letter-spacing="2" fill="#A8A29E">PLATFORM FEE</text>
  <text x="914" y="406" font-size="13" fill="#1C1917">Help cover our fees (2%)</text>

  <!-- Slider (the selected variant showing in live preview) -->
  <rect x="914" y="428" width="428" height="6" rx="3" fill="#DED9D2"/>
  <rect x="914" y="428" width="428" height="6" rx="3" fill="#2B4D38"/>
  <circle cx="1342" cy="431" r="14" fill="white" stroke="#2B4D38" stroke-width="2.5"/>
  <!-- Tooltip -->
  <rect x="1314" y="404" width="56" height="26" rx="6" fill="#2B4D38"/>
  <text x="1342" y="422" font-size="12" font-weight="600" fill="white" text-anchor="middle">$2.00</text>
  <text x="914" y="462" font-size="11" fill="#A8A29E">$0</text>
  <text x="1342" y="462" font-size="11" fill="#A8A29E" text-anchor="end">$2.00</text>

  <line x1="914" y1="484" x2="1366" y2="484" stroke="#EDE9E3" stroke-width="1"/>
  <text x="914" y="512" font-size="13" fill="#78716C">Your total</text>
  <text x="1366" y="512" font-size="24" font-weight="700" fill="#1C1917" text-anchor="end">$102.00</text>

  <rect x="914" y="534" width="428" height="52" rx="10" fill="#2B4D38"/>
  <text x="1128" y="565" font-size="14" font-weight="600" fill="white" text-anchor="middle">Donate $102.00</text>

  <!-- PM/Eng annotation notes overlaid -->
  <rect x="1384" y="420" width="130" height="60" rx="8" fill="#FFFBEA" stroke="#E8D48C" stroke-width="1"/>
  <text x="1394" y="440" font-size="10" fill="#78716C">PM: "feels right,</text>
  <text x="1394" y="456" font-size="10" fill="#78716C">can we cap at</text>
  <text x="1394" y="472" font-size="10" fill="#78716C">full fee only?"</text>
  <!-- Arrow -->
  <path d="M 1356 431 L 1382 444" stroke="#E8D48C" stroke-width="1.5" fill="none"/>

  <text x="1140" y="790" font-size="11" fill="#A8A29E" text-anchor="middle">Toggle parameters left → preview updates in real time</text>

  <!-- Connector arrow between panels -->
  <path d="M 682 500 C 710 500 720 500 736 500" fill="none" stroke="#383430" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#383430"/>
    </marker>
  </defs>

  <text x="80" y="870" font-size="10" letter-spacing="2" fill="#C0BAB2">raisely · fee opt-in experimentation · cursor + magicpatterns prototype</text>
</svg>

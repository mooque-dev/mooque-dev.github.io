<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <filter id="s6"><feDropShadow dx="0" dy="10" stdDeviation="28" flood-color="#1C1917" flood-opacity="0.12"/></filter>
    <filter id="s6b"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1C1917" flood-opacity="0.07"/></filter>
    <clipPath id="phone1"><rect x="174" y="80" width="340" height="740" rx="36"/></clipPath>
    <clipPath id="phone2"><rect x="882" y="80" width="340" height="740" rx="36"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#F2EFE9"/>

  <text x="80" y="68" font-size="10" letter-spacing="3" fill="#A8A29E" font-weight="500">WHAT'S NEXT · MOBILE-FIRST OPTIMIZATION · 60%+ OF DONATIONS</text>

  <!-- ===== LEFT PHONE: CURRENT MOBILE (problems) ===== -->
  <!-- Phone shell -->
  <rect x="162" y="68" width="364" height="764" rx="46" fill="#2C2A28" filter="url(#s6)"/>
  <rect x="174" y="80" width="340" height="740" rx="36" fill="#FAFAF8"/>
  <!-- Notch -->
  <rect x="296" y="80" width="96" height="28" rx="14" fill="#2C2A28"/>

  <!-- Screen content — donation form with mobile problems -->
  <g clip-path="url(#phone1)">
    <!-- Header -->
    <rect x="174" y="80" width="340" height="96" fill="#2B4D38"/>
    <text x="344" y="128" font-size="10" letter-spacing="1.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">HOPE FOUNDATION</text>
    <text x="344" y="152" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Complete your donation</text>

    <!-- Content area — cramped, double scroll indicated -->
    <rect x="186" y="186" width="316" height="430" rx="0" fill="#FAFAF8"/>

    <!-- Amount -->
    <text x="202" y="210" font-size="9" letter-spacing="2" fill="#A8A29E">DONATION</text>
    <text x="202" y="240" font-size="28" font-weight="700" fill="#1C1917" letter-spacing="-1">$100.00</text>

    <!-- Nested scroll zone — highlighted as problem -->
    <rect x="186" y="254" width="316" height="240" rx="0" fill="#FBF6F0" stroke="#F0D8BC" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Inner scroll content -->
    <text x="202" y="278" font-size="9" letter-spacing="2" fill="#C9A040">NESTED SCROLL ZONE ⚠</text>
    <line x1="202" y1="290" x2="486" y2="290" stroke="#EDE9E3" stroke-width="1"/>

    <text x="202" y="314" font-size="11" fill="#1C1917">Name</text>
    <rect x="202" y="322" width="268" height="32" rx="6" fill="white" stroke="#DED9D2" stroke-width="1"/>
    <text x="218" y="343" font-size="11" fill="#A8A29E">Your full name</text>

    <text x="202" y="370" font-size="11" fill="#1C1917">Email</text>
    <rect x="202" y="378" width="268" height="32" rx="6" fill="white" stroke="#DED9D2" stroke-width="1"/>
    <text x="218" y="399" font-size="11" fill="#A8A29E">you@email.com</text>

    <text x="202" y="426" font-size="11" fill="#1C1917">Card number</text>
    <rect x="202" y="434" width="268" height="32" rx="6" fill="white" stroke="#DED9D2" stroke-width="1"/>
    <text x="218" y="455" font-size="11" fill="#A8A29E">···· ···· ···· ····</text>

    <!-- Scroll indicator -->
    <rect x="484" y="320" width="4" height="140" rx="2" fill="#EDE9E3"/>
    <rect x="484" y="360" width="4" height="48" rx="2" fill="#C0BAB2"/>

    <!-- Platform fee — buried below scroll -->
    <rect x="186" y="502" width="316" height="56" rx="0" fill="#FAF8F5"/>
    <text x="202" y="524" font-size="9" letter-spacing="2" fill="#A8A29E">PLATFORM FEE</text>
    <text x="202" y="546" font-size="11" fill="#78716C">Cover our fees ($2.00)</text>
    <text x="486" y="546" font-size="12" fill="#2B4D38" text-anchor="end">✓  On</text>

    <!-- Total — pushed down by scroll -->
    <line x1="186" y1="564" x2="502" y2="564" stroke="#EDE9E3" stroke-width="1"/>
    <text x="202" y="588" font-size="12" fill="#78716C">Total</text>
    <text x="486" y="588" font-size="16" font-weight="700" fill="#1C1917" text-anchor="end">$102.00</text>

    <!-- CTA below the fold -->
    <rect x="186" y="606" width="316" height="44" rx="10" fill="#2B4D38" opacity="0.4"/>
    <text x="344" y="633" font-size="12" font-weight="600" fill="white" text-anchor="middle" opacity="0.5">Donate ↓ scroll to see</text>
  </g>

  <!-- Problem annotations -->
  <rect x="524" y="146" width="260" height="52" rx="8" fill="white" filter="url(#s6b)"/>
  <rect x="524" y="146" width="3" height="52" rx="1.5" fill="#C94040"/>
  <text x="538" y="166" font-size="11" font-weight="600" fill="#1C1917">Double-wrapped scroll</text>
  <text x="538" y="182" font-size="11" fill="#78716C">Page scroll + inner form scroll</text>
  <text x="538" y="198" font-size="11" fill="#78716C">compete. Gesture conflict on iOS.</text>
  <path d="M 522 172 C 500 296 500 360 502 380" fill="none" stroke="#F0D8BC" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="524" y="502" width="260" height="52" rx="8" fill="white" filter="url(#s6b)"/>
  <rect x="524" y="502" width="3" height="52" rx="1.5" fill="#C94040"/>
  <text x="538" y="522" font-size="11" font-weight="600" fill="#1C1917">Fee buried below scroll</text>
  <text x="538" y="538" font-size="11" fill="#78716C">Most donors never see the fee</text>
  <text x="538" y="554" font-size="11" fill="#78716C">opt-in before hitting Donate.</text>
  <path d="M 522 528 L 504 528" fill="none" stroke="#DED9D2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Label below left phone -->
  <text x="344" y="838" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Current</text>
  <text x="344" y="858" font-size="11" fill="#A8A29E" text-anchor="middle">Problems identified</text>

  <!-- ===== CENTER: ARROW + STATS ===== -->
  <text x="800" y="380" font-size="48" fill="#DED9D2" text-anchor="middle">→</text>
  <text x="800" y="430" font-size="11" fill="#A8A29E" text-anchor="middle" letter-spacing="1">NEXT BET</text>
  <rect x="730" y="450" width="140" height="32" rx="16" fill="#E8F0EB"/>
  <text x="800" y="471" font-size="12" fill="#2B4D38" text-anchor="middle" font-weight="600">60%+ mobile</text>

  <!-- ===== RIGHT PHONE: IMPROVED MOBILE ===== -->
  <!-- Phone shell -->
  <rect x="870" y="68" width="364" height="764" rx="46" fill="#2C2A28" filter="url(#s6)"/>
  <rect x="882" y="80" width="340" height="740" rx="36" fill="#FAFAF8"/>
  <!-- Notch -->
  <rect x="1004" y="80" width="96" height="28" rx="14" fill="#2C2A28"/>

  <g clip-path="url(#phone2)">
    <!-- Header -->
    <rect x="882" y="80" width="340" height="96" fill="#2B4D38"/>
    <text x="1052" y="128" font-size="10" letter-spacing="1.5" fill="rgba(255,255,255,0.5)" text-anchor="middle">HOPE FOUNDATION</text>
    <text x="1052" y="152" font-size="12" fill="rgba(255,255,255,0.85)" text-anchor="middle">Review your donation</text>

    <!-- Step indicator pills -->

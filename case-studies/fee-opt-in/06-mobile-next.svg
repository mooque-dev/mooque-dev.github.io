    <text x="1052" y="202" font-size="10" fill="#78716C" text-anchor="middle">Step 3 of 3 · Review</text>

    <!-- Single scroll — no nesting -->
    <!-- Donation row -->
    <text x="902" y="236" font-size="9" letter-spacing="2" fill="#A8A29E">YOUR CONTRIBUTION</text>
    <line x1="902" y1="248" x2="1202" y2="248" stroke="#EDE9E3" stroke-width="1"/>

    <text x="902" y="274" font-size="13" fill="#78716C">Donation</text>
    <text x="1200" y="274" font-size="13" font-weight="600" fill="#1C1917" text-anchor="end">$100.00</text>

    <!-- Inline fee + slider — prominent, not buried -->
    <rect x="902" y="286" width="298" height="68" rx="10" fill="#F2EFE9"/>
    <text x="918" y="310" font-size="12" fill="#1C1917" font-weight="500">Platform support</text>
    <text x="1184" y="310" font-size="12" fill="#2B4D38" font-weight="600" text-anchor="end">$2.00</text>
    <!-- Inline mini slider -->
    <rect x="918" y="328" width="264" height="4" rx="2" fill="#DED9D2"/>
    <rect x="918" y="328" width="264" height="4" rx="2" fill="#2B4D38"/>
    <circle cx="1182" cy="330" r="10" fill="white" stroke="#2B4D38" stroke-width="2"/>
    <text x="918" y="348" font-size="9" fill="#A8A29E">$0</text>
    <text x="1182" y="348" font-size="9" fill="#A8A29E" text-anchor="end">$2.00</text>

    <!-- Total — immediately visible -->
    <line x1="902" y1="372" x2="1202" y2="372" stroke="#EDE9E3" stroke-width="1"/>
    <text x="902" y="400" font-size="13" fill="#78716C">Total today</text>
    <text x="1200" y="404" font-size="28" font-weight="800" fill="#1C1917" text-anchor="end" letter-spacing="-1">$102</text>

    <!-- Summary card -->
    <rect x="902" y="424" width="298" height="72" rx="10" fill="white" stroke="#EDE9E3" stroke-width="1"/>
    <text x="918" y="448" font-size="11" fill="#78716C">Visa ···· 4242</text>
    <text x="918" y="466" font-size="11" fill="#78716C">allenella0711@gmail.com</text>
    <text x="918" y="484" font-size="11" fill="#78716C">Instant receipt · Processed by Raisely</text>

    <!-- CTA — large tap target, always visible -->
    <rect x="902" y="514" width="298" height="60" rx="12" fill="#2B4D38"/>
    <text x="1052" y="550" font-size="16" font-weight="700" fill="white" text-anchor="middle">Donate $102.00</text>

    <!-- Trust row -->
    <text x="1052" y="598" font-size="10" fill="#A8A29E" text-anchor="middle">🔒  Secure · PCI compliant</text>
  </g>

  <!-- Improvement annotations -->
  <rect x="1240" y="276" width="268" height="52" rx="8" fill="white" filter="url(#s6b)"/>
  <rect x="1505" y="276" width="3" height="52" rx="1.5" fill="#2B4D38"/>
  <text x="1256" y="296" font-size="11" font-weight="600" fill="#1C1917">Single scroll surface</text>
  <text x="1256" y="312" font-size="11" fill="#78716C">No nested scroll containers.</text>
  <text x="1256" y="328" font-size="11" fill="#78716C">Natural gesture behavior restored.</text>
  <path d="M 1238 302 L 1204 302" fill="none" stroke="#DED9D2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="1240" y="380" width="268" height="52" rx="8" fill="white" filter="url(#s6b)"/>
  <rect x="1505" y="380" width="3" height="52" rx="1.5" fill="#2B4D38"/>
  <text x="1256" y="400" font-size="11" font-weight="600" fill="#1C1917">Fee visible before checkout</text>
  <text x="1256" y="416" font-size="11" fill="#78716C">Slider integrated inline with the</text>
  <text x="1256" y="432" font-size="11" fill="#78716C">review step — not an afterthought.</text>
  <path d="M 1238 406 L 1204 350" fill="none" stroke="#DED9D2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <rect x="1240" y="494" width="268" height="52" rx="8" fill="white" filter="url(#s6b)"/>
  <rect x="1505" y="494" width="3" height="52" rx="1.5" fill="#2B4D38"/>
  <text x="1256" y="514" font-size="11" font-weight="600" fill="#1C1917">CTA always in thumb reach</text>
  <text x="1256" y="530" font-size="11" fill="#78716C">Donate button doesn't require</text>
  <text x="1256" y="546" font-size="11" fill="#78716C">scrolling past a payment form.</text>
  <path d="M 1238 520 L 1204 544" fill="none" stroke="#DED9D2" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="1052" y="838" font-size="14" font-weight="600" fill="#1C1917" text-anchor="middle">Proposed</text>
  <text x="1052" y="858" font-size="11" fill="#A8A29E" text-anchor="middle">Same thesis · new surface</text>

  <text x="80" y="870" font-size="10" letter-spacing="2" fill="#C0BAB2">raisely · fee opt-in experimentation · mobile next</text>
</svg>

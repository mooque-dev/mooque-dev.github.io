<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lunch Counter</title>
<script>
  // Pick the language before anything is drawn, so both never flash on screen.
  try { document.documentElement.dataset.lang = localStorage.getItem("jm-lang") || (/^ko/i.test(navigator.language) ? "ko" : "en"); }
  catch (e) { document.documentElement.dataset.lang = /^ko/i.test(navigator.language) ? "ko" : "en"; }
</script>
<style>
  :root {
    --bg:#fbf8f1; --card:#ffffff; --ink:#111111; --muted:#444444; --line:#cfc8b8;
    --accent:#1f5c3d; --accent-ink:#ffffff; --accent-soft:#e3f0e8; --err:#9b1c1c; --err-soft:#fde8e8;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:22px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  main { max-width:620px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:36px; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:28px; margin:0 0 16px; }
  html[data-lang="en"] .ko, html[data-lang="ko"] .en { display:none !important; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .lang { display:flex; border:3px solid var(--accent); border-radius:999px; overflow:hidden; flex:none; }
  .lang button { min-height:52px; min-width:84px; padding:6px 16px; font-size:20px; font-weight:700; border:0; background:#fff; color:var(--accent); cursor:pointer; }
  .lang button[aria-pressed="true"] { background:var(--accent); color:#fff; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:24px; margin-top:24px; }
  label.field { display:block; font-weight:700; margin-bottom:10px; }
  .pwrow { display:flex; gap:10px; }
  input[type=password], input[type=text] {
    flex:1; min-width:0; font-size:26px; padding:16px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink);
  }
  input:focus, button:focus-visible { outline:4px solid #e0a100; outline-offset:2px; }
  .btn {
    text-align:center; line-height:1.25; padding:12px 16px;
    display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:76px; margin-top:18px;
    font-size:26px; font-weight:700; border:0; border-radius:16px; background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  .btn:active { transform:scale(0.99); }
  .btn.secondary { background:#fff; color:var(--accent); border:3px solid var(--accent); }
  .show { flex:none; min-width:96px; font-size:20px; font-weight:700; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; }
  .msg { margin-top:16px; padding:16px; border-radius:14px; font-weight:700; }
  .msg.err { background:var(--err-soft); color:var(--err); border:2px solid var(--err); }
  .steps { margin:0; padding-left:1.3em; }
  .steps li { margin-bottom:8px; }
  .icon { font-size:34px; line-height:1; }
  .loading { text-align:center; font-size:26px; font-weight:700; padding:32px 0; }
  .report-head { font-weight:700; word-break:break-word; }
  .report-date { color:var(--muted); margin-top:4px; }
  .rows { margin-top:16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; border-top:2px solid var(--line); }
  .row:first-child { border-top:0; }
  .name { font-weight:700; font-size:24px; line-height:1.3; }
  .num { font-size:52px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; color:var(--accent); }
  .num.zero { color:#888; }
  .note { color:var(--muted); font-size:20px; margin-top:12px; }
  .shift { display:flex; align-items:center; gap:12px; margin-top:14px; padding:14px 16px; border-radius:14px; font-weight:700; font-size:22px; line-height:1.3; }
  .shift .icon { font-size:32px; }
  .shift.evening { background:#e6e9f7; border:2px solid #4a56a6; }
  .shift.morning { background:#fff4d6; border:2px solid #d9a400; }
  .parts { display:block; font-size:18px; color:var(--muted); font-weight:500; margin-top:2px; }
  #jump h2 { margin-bottom:8px; }
  .jumpbtn { display:flex; align-items:center; gap:14px; width:100%; min-height:72px; margin-top:12px; padding:12px 16px; text-align:left;
    font-size:22px; font-weight:700; line-height:1.25; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:14px; cursor:pointer; }
  .jumpbtn .icon { font-size:30px; }
  .jumpbtn .arrow { margin-left:auto; font-size:28px; color:var(--accent); }
  .count { display:inline-block; font-size:18px; font-weight:700; color:#fff; background:var(--accent); border-radius:999px; padding:4px 14px; margin-bottom:12px; }
  .when { font-size:26px; font-weight:800; line-height:1.25; }
  .fname { font-size:18px; color:var(--muted); margin-top:6px; word-break:break-word; }
  .top { display:block; margin:16px auto 0; font-size:20px; font-weight:700; color:var(--accent); background:none; border:0; padding:12px; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="en">Lunch Counter</span><span class="ko">점심 판매 수량</span></h1>
    <div class="lang" role="group" aria-label="Language / 언어">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="ko" lang="ko">한국어</button>
    </div>
  </header>

  <!-- Step 1: password -->
  <form id="gate" class="card">
    <h2><span class="en">Please sign in</span><span class="ko">비밀번호를 입력하세요</span></h2>
    <label class="field" for="pw"><span class="en">Password</span><span class="ko">비밀번호</span></label>
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="show" id="toggle"><span class="en">Show</span><span class="ko">보기</span></button>
    </div>
    <div class="msg err" id="gateErr" role="alert" hidden></div>
    <button type="submit" class="btn"><span class="en">Sign in</span><span class="ko">들어가기</span> <span aria-hidden="true">→</span></button>
  </form>

  <!-- Step 2: pick a file -->
  <section id="pick" hidden>
    <div class="card">
      <h2><span class="en">Check a sales report</span><span class="ko">판매 보고서 확인</span></h2>
      <ol class="steps">
        <li><span class="en">Press the green button below.</span><span class="ko">아래 초록색 버튼을 누르세요.</span></li>
        <li><span class="en">Choose one or more sales report PDFs.</span><span class="ko">판매 보고서 PDF를 하나 이상 고르세요.</span></li>
        <li><span class="en">The numbers appear right away.</span><span class="ko">수량이 바로 나옵니다.</span></li>
      </ol>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
      <button type="button" class="btn" id="chooseBtn"><span class="icon" aria-hidden="true">📄</span> <span class="en">Choose PDF</span><span class="ko">PDF 파일 선택</span></button>
    </div>
  </section>

  <!-- Step 3: results -->
  <section id="result" hidden aria-live="polite">
    <nav id="jump" class="card" hidden></nav>
    <div id="cards"></div>
    <button type="button" class="btn secondary" id="againBtn"><span class="en">Check other reports</span><span class="ko">다른 보고서 확인</span></button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const HASH = "977cf8c97f6ffa2518898a8361a44ee1dee2316b391be24b1d5d82769659ee50";
const ITEMS = [
  ["KoreanLunch", "Korean Lunch", "한식 점심"],
  ["KoreanMainDish", "Korean Main Dish", "한식 메인"],
  ["InternationalLunch", "International Lunch", "인터내셔널 점심"],
  ["InternationalMainDish", "International Main Dish", "인터내셔널 메인"],
  ["VegetarianLunch", "Vegetarian Lunch", "채식 점심"],
  ["BoxedLunch", "Boxed Lunch", "도시락"],
];
const LABEL = Object.fromEntries(ITEMS.map(([k, en, ko]) => [k, { en, ko }]));
// Night report (1:01 PM – 11:00 PM): every item on its own line.
const EVENING_ROWS = ITEMS.map(([k, en, ko]) => ({ keys: [k], en, ko }));
// Morning report (11:00 PM – 1:00 PM next day): Korean and International combined.
const MORNING_ROWS = [
  { keys: ["KoreanLunch", "KoreanMainDish"], en: "Korean", ko: "한식" },
  { keys: ["InternationalLunch", "InternationalMainDish"], en: "International", ko: "인터내셔널" },
  { keys: ["VegetarianLunch"], en: "Vegetarian", ko: "채식" },
  { keys: ["BoxedLunch"], en: "Boxed", ko: "도시락" },
];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const T = (en, ko) => `<span class="en">${en}</span><span class="ko">${ko}</span>`;

// Language: remembered on this device; first visit follows the phone's language.
function setLang(l) {
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  try { localStorage.setItem("jm-lang", l); } catch (e) {}
}
let lang = null;
try { lang = localStorage.getItem("jm-lang"); } catch (e) {}
setLang(lang || (/^ko/i.test(navigator.language) ? "ko" : "en"));
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
function show(id) { ["gate", "pick", "result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

// Stay signed in on this device so she isn't asked every time.
let signedIn = false;
try { signedIn = localStorage.getItem("jm-ok") === HASH; } catch (e) {}
show(signedIn ? "pick" : "gate");
if (!signedIn) $("pw").focus();

$("toggle").addEventListener("click", () => {
  const p = $("pw"), hidden = p.type === "password";
  p.type = hidden ? "text" : "password";
  $("toggle").innerHTML = hidden ? T("Hide", "숨기기") : T("Show", "보기");
});

$("gate").addEventListener("submit", async e => {
  e.preventDefault();
  if (await sha256($("pw").value.trim()) === HASH) {
    try { localStorage.setItem("jm-ok", HASH); } catch (e) {}
    $("gateErr").hidden = true;
    show("pick");
  } else {
    $("gateErr").innerHTML = T("That password is not right. Please try again.", "비밀번호가 맞지 않습니다. 다시 입력해 주세요.");
    $("gateErr").hidden = false;
  }
});

// Rebuild table rows from positioned text items.
async function readRows(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const rows = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const { items } = await (await pdf.getPage(p)).getTextContent();
    const lines = [];
    for (const it of items) {
      if (!it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let line = lines.find(l => Math.abs(l.y - y) < 3);
      if (!line) lines.push(line = { y, parts: [] });
      line.parts.push({ x, s: it.str });
    }
    lines.sort((a, b) => b.y - a.y);
    for (const l of lines) rows.push(l.parts.sort((a, b) => a.x - b.x).map(t => t.s).join(" "));
  }
  return rows;
}

function extract(rows) {
  const out = {};
  let range = "";
  for (const row of rows) {
    const compact = row.replace(/\s+/g, "");
    if (!range && /(Mon|Tue|Wed|Thu|Fri|Sat|Sun).*\d{4}/.test(compact)) range = compact.replace(/,/g, ", ").replace(/([A-Za-z]{3})(\d)/g, "$1 $2").replace(/(\d)(AM|PM)/g, "$1 $2").replace(/-{2,}/, "  →  ");
    for (const [key] of ITEMS) {
      if (!new RegExp(key + "(?=[\\d-])", "i").test(compact)) continue;
      const nums = row.match(/-?\d[\d,]*\.\d{2}/g) || [];
      if (nums.length >= 2) out[key] = (out[key] || 0) + parseFloat(nums[nums.length - 2].replace(/,/g, ""));
    }
  }
  // Start time decides the shift: 11 PM start (or 1:00 PM end) = overnight report.
  const times = range.replace(/\s+/g, "").match(/\d{1,2}:\d{2}(AM|PM)/gi) || [];
  const morning = /^11:\d{2}PM$/i.test(times[0] || "") || /^1:00PM$/i.test(times[1] || "");
  return { out, range, morning };
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const MONTHS = "JanFebMarAprMayJunJulAugSepOctNovDec";
// "Tue, Sep 29, 2026, 1:01 PM" -> sortable number and a short "Tue, Sep 29" label.
function when(range) {
  const m = range.match(/([A-Za-z]{3}),\s*([A-Za-z]{3})\s*(\d{1,2}),\s*(\d{4}),\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if (!m) return { sort: Infinity, label: "", labelKo: "" };
  const h = (+m[5] % 12) + (/pm/i.test(m[7]) ? 12 : 0);
  return { sort: new Date(+m[4], MONTHS.indexOf(m[2]) / 3, +m[3], h, +m[6]).getTime(), label: `${m[1]}, ${m[2]} ${m[3]}`,
    labelKo: `${MONTHS.indexOf(m[2]) / 3 + 1}월 ${+m[3]}일 (${"일월화수목금토"["SunMonTueWedThuFriSat".indexOf(m[1]) / 3]})` };
}

function shiftBadge(morning) {
  return morning
    ? `<div class="shift morning"><span class="icon" aria-hidden="true">☀️</span><div>${T("Morning report", "오전 보고서")}<span class="parts">11:00 PM – 1:00 PM</span></div></div>`
    : `<div class="shift evening"><span class="icon" aria-hidden="true">🌙</span><div>${T("Night report", "야간 보고서")}<span class="parts">1:01 PM – 11:00 PM</span></div></div>`;
}

function reportHTML(r, i, total) {
  if (r.error) return `<div class="card">${total > 1 ? `<span class="count">${T(`Report ${i + 1} of ${total}`, `보고서 ${i + 1} / ${total}`)}</span>` : ""}
    <div class="fname">${esc(r.name)}</div>
    <div class="msg err" role="alert">${T("Sorry, this file could not be read. Please make sure it is the sales report PDF.", "파일을 읽을 수 없습니다. 판매 보고서 PDF인지 확인해 주세요.")}</div></div>`;
  return `<div class="card" id="report-${i}">` +
    (total > 1 ? `<span class="count">${T(`Report ${i + 1} of ${total}`, `보고서 ${i + 1} / ${total}`)}</span>` : "") +
    `<div class="when">${r.label ? T(esc(r.label), esc(r.labelKo)) : T("Sales report", "판매 보고서")}</div>` +
    (r.range ? `<div class="report-date">${esc(r.range)}</div>` : "") +
    `<div class="fname">📄 ${esc(r.name)}</div>` +
    shiftBadge(r.morning) +
    `<div class="rows">` +
    (r.morning ? MORNING_ROWS : EVENING_ROWS).map(row => {
      const n = row.keys.reduce((t, k) => t + (r.out[k] || 0), 0);
      const parts = row.keys.length > 1 ? `<span class="parts">${row.keys.map(k => `${T(LABEL[k].en, LABEL[k].ko)} ${r.out[k] || 0}`).join(" + ")}</span>` : "";
      return `<div class="row"><div class="name">${T(row.en, row.ko)}${parts}</div><div class="num${n ? "" : " zero"}">${n}</div></div>`;
    }).join("") +
    `</div><div class="note">${T("Numbers are net quantity sold.", "순 판매 수량입니다.")}</div>` +
    (total > 1 ? `<button type="button" class="top" data-top>↑ ${T("Back to list", "목록으로")}</button>` : "") +
    `</div>`;
}

async function handle(files) {
  files = files.filter(Boolean);
  if (!files.length) return;
  $("jump").hidden = true;
  $("cards").innerHTML = `<div class="card"><div class="loading">${T(`Reading ${files.length > 1 ? files.length + " reports" : "the report"}…`, "보고서를 읽는 중…")}</div></div>`;
  show("result");
  const reports = await Promise.all(files.map(async f => {
    try {
      const r = extract(await readRows(await f.arrayBuffer()));
      if (!Object.keys(r.out).length) throw new Error("none");
      return { name: f.name, ...r, ...when(r.range) };
    } catch (e) { return { name: f.name, error: true, sort: Infinity }; }
  }));
  // Oldest first, so the list reads like a calendar.
  reports.sort((a, b) => a.sort - b.sort);
  const total = reports.length;
  $("cards").innerHTML = reports.map((r, i) => reportHTML(r, i, total)).join("");
  if (total > 1) {
    $("jump").innerHTML = `<h2>${T(`${total} reports`, `보고서 ${total}개`)}</h2>
      <div class="note" style="margin-top:0">${T("Tap one to jump to it, or scroll down.", "눌러서 이동하거나 아래로 내리세요.")}</div>` +
      reports.map((r, i) => `<button type="button" class="jumpbtn" data-go="${i}">
        <span class="icon" aria-hidden="true">${r.error ? "⚠️" : r.morning ? "☀️" : "🌙"}</span>
        <span>${r.error ? esc(r.name) : r.label ? T(esc(r.label), esc(r.labelKo)) : esc(r.name)}<span class="parts">${r.error ? T("Could not read", "읽을 수 없음") : r.morning ? T("Morning report", "오전 보고서") : T("Night report", "야간 보고서")}</span></span>
        <span class="arrow" aria-hidden="true">↓</span></button>`).join("");
    $("jump").hidden = false;
  }
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { const el = document.getElementById("report-" + go.dataset.go) || $("cards").children[go.dataset.go]; el.scrollIntoView({ behavior: "smooth", block: "start" }); }
  if (e.target.closest("[data-top]")) $("jump").scrollIntoView({ behavior: "smooth", block: "start" });
});

$("chooseBtn").addEventListener("click", () => { $("file").value = ""; $("file").click(); });
$("againBtn").addEventListener("click", () => { $("file").value = ""; $("file").click(); });
$("file").addEventListener("change", () => handle([...$("file").files]));
// Dropping a file anywhere also works on a computer.
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  if (!$("gate").hidden) return;
  handle([...e.dataTransfer.files].filter(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)));
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lunch Counter</title>
<style>
  :root {
    --bg:#fbf8f1; --card:#ffffff; --ink:#111111; --muted:#444444; --line:#cfc8b8;
    --accent:#1f5c3d; --accent-ink:#ffffff; --accent-soft:#e3f0e8; --err:#9b1c1c; --err-soft:#fde8e8;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:22px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  main { max-width:620px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:36px; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:28px; margin:0 0 16px; }
  .ko { display:block; font-size:0.8em; color:var(--muted); font-weight:500; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:24px; margin-top:24px; }
  label.field { display:block; font-weight:700; margin-bottom:10px; }
  .pwrow { display:flex; gap:10px; }
  input[type=password], input[type=text] {
    flex:1; min-width:0; font-size:26px; padding:16px; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink);
  }
  input:focus, button:focus-visible { outline:4px solid #e0a100; outline-offset:2px; }
  .btn {
    text-align:center; line-height:1.25; padding:12px 16px;
    display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:76px; margin-top:18px;
    font-size:26px; font-weight:700; border:0; border-radius:16px; background:var(--accent); color:var(--accent-ink); cursor:pointer;
  }
  .btn:active { transform:scale(0.99); }
  .btn.secondary { background:#fff; color:var(--accent); border:3px solid var(--accent); }
  .show { flex:none; min-width:96px; font-size:20px; font-weight:700; border:3px solid var(--ink); border-radius:14px; background:#fff; color:var(--ink); cursor:pointer; }
  .msg { margin-top:16px; padding:16px; border-radius:14px; font-weight:700; }
  .msg.err { background:var(--err-soft); color:var(--err); border:2px solid var(--err); }
  .steps { margin:0; padding-left:1.3em; }
  .steps li { margin-bottom:8px; }
  .icon { font-size:34px; line-height:1; }
  .loading { text-align:center; font-size:26px; font-weight:700; padding:32px 0; }
  .report-head { font-weight:700; word-break:break-word; }
  .report-date { color:var(--muted); margin-top:4px; }
  .rows { margin-top:16px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; border-top:2px solid var(--line); }
  .row:first-child { border-top:0; }
  .name { font-weight:700; font-size:24px; line-height:1.3; }
  .num { font-size:52px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; color:var(--accent); }
  .num.zero { color:#888; }
  .note { color:var(--muted); font-size:20px; margin-top:12px; }
  .shift { display:flex; align-items:center; gap:12px; margin-top:14px; padding:14px 16px; border-radius:14px; font-weight:700; font-size:22px; line-height:1.3; }
  .shift .icon { font-size:32px; }
  .shift.day { background:#fff4d6; border:2px solid #d9a400; }
  .shift.night { background:#e6e9f7; border:2px solid #4a56a6; }
  .parts { display:block; font-size:18px; color:var(--muted); font-weight:500; margin-top:2px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Lunch Counter <span class="ko">점심 판매 수량</span></h1>

  <!-- Step 1: password -->
  <form id="gate" class="card">
    <h2>Please sign in <span class="ko">비밀번호를 입력하세요</span></h2>
    <label class="field" for="pw">Password <span class="ko">비밀번호</span></label>
    <div class="pwrow">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" class="show" id="toggle">Show</button>
    </div>
    <div class="msg err" id="gateErr" role="alert" hidden></div>
    <button type="submit" class="btn">Sign in <span aria-hidden="true">→</span></button>
  </form>

  <!-- Step 2: pick a file -->
  <section id="pick" hidden>
    <div class="card">
      <h2>Check a sales report <span class="ko">판매 보고서 확인</span></h2>
      <ol class="steps">
        <li>Press the green button below. <span class="ko">아래 초록색 버튼을 누르세요.</span></li>
        <li>Choose the sales report PDF. <span class="ko">판매 보고서 PDF를 고르세요.</span></li>
        <li>The numbers appear right away. <span class="ko">수량이 바로 나옵니다.</span></li>
      </ol>
      <input id="file" type="file" accept="application/pdf,.pdf" hidden>
      <button type="button" class="btn" id="chooseBtn"><span class="icon" aria-hidden="true">📄</span> <span>Choose PDF<span class="ko" style="color:inherit">파일 선택</span></span></button>
    </div>
  </section>

  <!-- Step 3: results -->
  <section id="result" hidden aria-live="polite">
    <div class="card" id="resultCard"></div>
    <button type="button" class="btn secondary" id="againBtn"><span>Check another report<span class="ko" style="color:inherit">다른 보고서 확인</span></span></button>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const HASH = "977cf8c97f6ffa2518898a8361a44ee1dee2316b391be24b1d5d82769659ee50";
const ITEMS = [
  ["KoreanLunch", "Korean Lunch", "한식 점심"],
  ["KoreanMainDish", "Korean Main Dish", "한식 메인"],
  ["InternationalLunch", "International Lunch", "인터내셔널 점심"],
  ["InternationalMainDish", "International Main Dish", "인터내셔널 메인"],
  ["VegetarianLunch", "Vegetarian Lunch", "채식 점심"],
  ["BoxedLunch", "Boxed Lunch", "도시락"],
];
const LABEL = Object.fromEntries(ITEMS.map(([k, en]) => [k, en]));
// Afternoon (1:01 PM – 11:00 PM): every item on its own line.
const DAY_ROWS = ITEMS.map(([k, en, ko]) => ({ keys: [k], en, ko }));
// Overnight (11:00 PM – 1:00 PM next day): Korean and International combined.
const NIGHT_ROWS = [
  { keys: ["KoreanLunch", "KoreanMainDish"], en: "Korean", ko: "한식" },
  { keys: ["InternationalLunch", "InternationalMainDish"], en: "International", ko: "인터내셔널" },
  { keys: ["VegetarianLunch"], en: "Vegetarian", ko: "채식" },
  { keys: ["BoxedLunch"], en: "Boxed", ko: "도시락" },
];
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
function show(id) { ["gate", "pick", "result"].forEach(s => $(s).hidden = s !== id); window.scrollTo(0, 0); }

async function sha256(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

// Stay signed in on this device so she isn't asked every time.
let signedIn = false;
try { signedIn = localStorage.getItem("jm-ok") === HASH; } catch (e) {}
show(signedIn ? "pick" : "gate");
if (!signedIn) $("pw").focus();

$("toggle").addEventListener("click", () => {
  const p = $("pw"), hidden = p.type === "password";
  p.type = hidden ? "text" : "password";
  $("toggle").textContent = hidden ? "Hide" : "Show";
});

$("gate").addEventListener("submit", async e => {
  e.preventDefault();
  if (await sha256($("pw").value.trim()) === HASH) {
    try { localStorage.setItem("jm-ok", HASH); } catch (e) {}
    $("gateErr").hidden = true;
    show("pick");
  } else {
    $("gateErr").innerHTML = 'That password is not right. Please try again.<span class="ko">비밀번호가 맞지 않습니다. 다시 입력해 주세요.</span>';
    $("gateErr").hidden = false;
  }
});

// Rebuild table rows from positioned text items.
async function readRows(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const rows = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const { items } = await (await pdf.getPage(p)).getTextContent();
    const lines = [];
    for (const it of items) {
      if (!it.str.trim()) continue;
      const y = it.transform[5], x = it.transform[4];
      let line = lines.find(l => Math.abs(l.y - y) < 3);
      if (!line) lines.push(line = { y, parts: [] });
      line.parts.push({ x, s: it.str });
    }
    lines.sort((a, b) => b.y - a.y);
    for (const l of lines) rows.push(l.parts.sort((a, b) => a.x - b.x).map(t => t.s).join(" "));
  }
  return rows;
}

function extract(rows) {
  const out = {};
  let range = "";
  for (const row of rows) {
    const compact = row.replace(/\s+/g, "");
    if (!range && /(Mon|Tue|Wed|Thu|Fri|Sat|Sun).*\d{4}/.test(compact)) range = compact.replace(/,/g, ", ").replace(/([A-Za-z]{3})(\d)/g, "$1 $2").replace(/(\d)(AM|PM)/g, "$1 $2").replace(/-{2,}/, "  →  ");
    for (const [key] of ITEMS) {
      if (!new RegExp(key + "(?=[\\d-])", "i").test(compact)) continue;
      const nums = row.match(/-?\d[\d,]*\.\d{2}/g) || [];
      if (nums.length >= 2) out[key] = (out[key] || 0) + parseFloat(nums[nums.length - 2].replace(/,/g, ""));
    }
  }
  // Start time decides the shift: 11 PM start (or 1:00 PM end) = overnight report.
  const times = range.replace(/\s+/g, "").match(/\d{1,2}:\d{2}(AM|PM)/gi) || [];
  const night = /^11:\d{2}PM$/i.test(times[0] || "") || /^1:00PM$/i.test(times[1] || "");
  return { out, range, night };
}

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function handle(file) {
  if (!file) return;
  const card = $("resultCard");
  card.innerHTML = '<div class="loading">Reading the report…<span class="ko">보고서를 읽는 중…</span></div>';
  show("result");
  try {
    const { out, range, night } = extract(await readRows(await file.arrayBuffer()));
    if (!Object.keys(out).length) throw new Error("none");
    card.innerHTML =
      `<div class="report-head">${esc(file.name)}</div>` +
      (range ? `<div class="report-date">${esc(range)}</div>` : "") +
      (night
        ? `<div class="shift night"><span class="icon" aria-hidden="true">🌙</span><div>Overnight report<span class="ko">야간 보고서 · 11:00 PM – 1:00 PM</span></div></div>`
        : `<div class="shift day"><span class="icon" aria-hidden="true">☀️</span><div>Afternoon report<span class="ko">오후 보고서 · 1:01 PM – 11:00 PM</span></div></div>`) +
      `<div class="rows">` +
      (night ? NIGHT_ROWS : DAY_ROWS).map(r => {
        const n = r.keys.reduce((t, k) => t + (out[k] || 0), 0);
        const parts = r.keys.length > 1 ? `<span class="parts">${r.keys.map(k => `${LABEL[k]} ${out[k] || 0}`).join(" + ")}</span>` : "";
        return `<div class="row"><div class="name">${r.en}<span class="ko">${r.ko}</span>${parts}</div><div class="num${n ? "" : " zero"}">${n}</div></div>`;
      }).join("") +
      `</div><div class="note">Numbers are net quantity sold. <span class="ko">순 판매 수량입니다.</span></div>`;
  } catch (err) {
    card.innerHTML = '<div class="msg err" role="alert">Sorry, this file could not be read. Please make sure it is the sales report PDF.<span class="ko">파일을 읽을 수 없습니다. 판매 보고서 PDF인지 확인해 주세요.</span></div>';
  }
}

$("chooseBtn").addEventListener("click", () => { $("file").value = ""; $("file").click(); });
$("againBtn").addEventListener("click", () => { $("file").value = ""; $("file").click(); });
$("file").addEventListener("change", () => handle($("file").files[0]));
// Dropping a file anywhere also works on a computer.
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  if (!$("gate").hidden) return;
  handle([...e.dataTransfer.files].find(f => /pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)));
});
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Case studies</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--fg:#111214;--muted:#6b6e76;--card:#f4f4f6;--line:#e4e4e8;--blue:#0060d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:36px 16px 80px}
h1{font-size:28px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--muted);margin:0 0 28px}
.folder{margin:0 0 40px}.fh{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.fh h2{font-size:20px;font-weight:600;margin:0}.fh span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tile{all:unset;cursor:pointer;display:block;background:var(--card);border-radius:12px;overflow:hidden;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}.tile:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.th{aspect-ratio:16/9;background:#fff center/contain no-repeat;border-bottom:1px solid var(--line)}
.meta{padding:10px 12px 12px}.kind{font-size:12px;color:var(--blue);font-weight:600}.title{font-size:15px;font-weight:500;line-height:1.3}
.view{position:fixed;inset:0;z-index:99;background:#fff;display:none}.view.on{display:block}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage img{max-width:100%;max-height:100%;display:block;background:#fff;box-shadow:0 0 0 1px var(--line)}
.stage iframe{width:100%;height:100%;border:0;background:#f3f4f7}
.bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(20,20,20,.82);border-radius:999px;padding:5px;opacity:.15;transition:opacity .2s}
.view:hover .bar,.bar:focus-within{opacity:1}
.bar button{font:600 13px/1 inherit;font-family:inherit;color:#fff;background:none;border:0;border-radius:999px;padding:9px 12px;cursor:pointer}
.bar button:hover{background:rgba(255,255,255,.14)}.bar span{color:#ddd;font-size:13px;padding:0 8px;min-width:70px;text-align:center;white-space:nowrap}.bar button:disabled{opacity:.35;cursor:default}
.bar [hidden]{display:none}
@media (prefers-reduced-motion:reduce){.tile,.bar{transition:none}}
</style></head><body><div class="wrap">
<section class="folder" data-f="tw"><div class="fh"><h2>Transaction Logging Redesign</h2></div><div class="grid"></div></section>
<section class="folder" data-f="or"><div class="fh"><h2>Orchid design system</h2></div><div class="grid"></div></section>
<section class="folder" data-f="tw7"><div class="fh"><h2>Transaction Logging Redesign, 7-slide version</h2></div><div class="grid"></div></section>
</div>
<div class="view" role="dialog" aria-label="Viewer"><div class="stage"></div><div class="bar"><button type="button" data-p="prev">Prev</button><span aria-live="polite"></span><button type="button" data-p="next">Next</button><button type="button" data-p="exit">Close</button></div></div>
<script>
(function(){
  var D={"items": {"tw": [{"kind": "Slides", "title": "Slides", "thumb": "img/cr/01.jpg", "deck": "cr"}, {"kind": "Prototype", "title": "Prototype", "thumb": "img/tw/04.jpg", "proto": true}, {"kind": "Slide", "title": "Problem", "img": "img/cr/03.jpg"}, {"kind": "Slide", "title": "Research to design", "img": "img/cr/04.jpg"}, {"kind": "Slide", "title": "Pop-up to full page", "img": "img/cr/06.jpg"}, {"kind": "Slide", "title": "Details page", "img": "img/cr/07.jpg"}, {"kind": "Slide", "title": "States", "img": "img/cr/08.jpg"}, {"kind": "Slide", "title": "Design system", "img": "img/cr/09.jpg"}, {"kind": "Slide", "title": "Impact", "img": "img/cr/10.jpg"}, {"kind": "Slide", "title": "Cost", "img": "img/cr/12.jpg"}, {"kind": "Slide", "title": "System map", "img": "img/cr/13.jpg"}], "or": [{"kind": "Slides", "title": "Slides", "thumb": "img/or/01.jpg", "deck": "or"}, {"kind": "Image", "title": "Variation audit", "img": "img/orsrc/untitled-11.png"}, {"kind": "Image", "title": "Survey", "img": "img/orsrc/untitled-1.jpg"}, {"kind": "Image", "title": "Usage rules", "img": "img/orsrc/untitled-10.jpg"}, {"kind": "Image", "title": "Storybook", "img": "img/orsrc/untitled-9.png"}, {"kind": "Image", "title": "Chromatic", "img": "img/orsrc/untitled-8.png"}, {"kind": "Slide", "title": "Snowflake reviews", "img": "img/or/06.jpg"}, {"kind": "Slide", "title": "Results", "img": "img/or/07.jpg"}], "tw7": [{"kind": "Slides", "title": "Slides", "thumb": "img/tw/01.jpg", "deck": "tw"}, {"kind": "Slide", "title": "Problem", "img": "img/tw/02.jpg"}, {"kind": "Slide", "title": "Cost", "img": "img/tw/03.jpg"}, {"kind": "Slide", "title": "Details page", "img": "img/tw/05.jpg"}, {"kind": "Slide", "title": "Impact", "img": "img/tw/06.jpg"}, {"kind": "Slide", "title": "Research to design", "img": "img/tw/08.jpg"}, {"kind": "Slide", "title": "System map", "img": "img/tw/09.jpg"}]}, "decks": {"tw": [{"src": "img/tw/01.jpg", "cap": "1 / 7", "live": false}, {"src": "img/tw/02.jpg", "cap": "2 / 7", "live": false}, {"src": "img/tw/03.jpg", "cap": "3 / 7", "live": false}, {"src": "img/tw/04.jpg", "cap": "4 / 7", "live": true}, {"src": "img/tw/05.jpg", "cap": "5 / 7", "live": false}, {"src": "img/tw/06.jpg", "cap": "6 / 7", "live": false}, {"src": "img/tw/07.jpg", "cap": "7 / 7", "live": false}, {"src": "img/tw/08.jpg", "cap": "Appendix A1", "live": false}, {"src": "img/tw/09.jpg", "cap": "Appendix A2", "live": false}, {"src": "img/tw/10.jpg", "cap": "Appendix A3", "live": false}, {"src": "img/tw/11.jpg", "cap": "Appendix A4", "live": false}, {"src": "img/tw/12.jpg", "cap": "Appendix A5", "live": false}, {"src": "img/tw/13.jpg", "cap": "Appendix A6", "live": false}, {"src": "img/tw/14.jpg", "cap": "Appendix A7", "live": false}, {"src": "img/tw/15.jpg", "cap": "Appendix A8", "live": false}, {"src": "img/tw/16.jpg", "cap": "Appendix A9", "live": false}, {"src": "img/tw/17.jpg", "cap": "Appendix A10", "live": false}, {"src": "img/tw/18.jpg", "cap": "Appendix A11", "live": false}], "or": [{"src": "img/or/01.jpg", "cap": "1 / 7"}, {"src": "img/or/02.jpg", "cap": "2 / 7"}, {"src": "img/or/03.jpg", "cap": "3 / 7"}, {"src": "img/or/04.jpg", "cap": "4 / 7"}, {"src": "img/or/05.jpg", "cap": "5 / 7"}, {"src": "img/or/06.jpg", "cap": "6 / 7"}, {"src": "img/or/07.jpg", "cap": "7 / 7"}], "cr": [{"src": "img/cr/01.jpg", "cap": "1 / 11", "live": false}, {"src": "img/cr/02.jpg", "cap": "2 / 11", "live": false}, {"src": "img/cr/03.jpg", "cap": "3 / 11", "live": false}, {"src": "img/cr/04.jpg", "cap": "4 / 11", "live": false}, {"src": "img/cr/05.webp", "cap": "5 / 11", "live": false}, {"src": "img/cr/06.jpg", "cap": "6 / 11", "live": false}, {"src": "img/cr/07.jpg", "cap": "7 / 11", "live": false}, {"src": "", "cap": "Demo, optional", "live": true}, {"src": "img/cr/08.jpg", "cap": "8 / 11", "live": false}, {"src": "img/cr/09.jpg", "cap": "9 / 11", "live": false}, {"src": "img/cr/10.jpg", "cap": "10 / 11", "live": false}, {"src": "img/cr/11.jpg", "cap": "11 / 11", "live": false}, {"src": "img/cr/12.jpg", "cap": "Appendix A1", "live": false}, {"src": "img/cr/13.jpg", "cap": "Appendix A2", "live": false}, {"src": "img/cr/14.jpg", "cap": "Appendix A3", "live": false}, {"src": "img/cr/15.jpg", "cap": "Appendix A4", "live": false}, {"src": "img/cr/16.jpg", "cap": "Appendix A5", "live": false}, {"src": "img/cr/17.jpg", "cap": "Appendix A6", "live": false}, {"src": "img/cr/18.jpg", "cap": "Appendix A7", "live": false}, {"src": "img/cr/19.jpg", "cap": "Appendix A8", "live": false}, {"src": "img/cr/20.jpg", "cap": "Appendix A9", "live": false}, {"src": "img/cr/21.jpg", "cap": "Appendix A10", "live": false}]}};
  var V=document.querySelector(".view"),stage=V.querySelector(".stage"),bar=V.querySelector(".bar"),count=bar.querySelector("span"),prev=bar.querySelector('[data-p=prev]'),next=bar.querySelector('[data-p=next]');
  var seq=null,i=0;
  ["tw","or","tw7"].forEach(function(f){
    var g=document.querySelector('[data-f="'+f+'"] .grid');
    D.items[f].forEach(function(it,n){
      var b=document.createElement("button");b.type="button";b.className="tile";
      b.innerHTML='<div class="th" style="background-image:url(\''+(it.thumb||it.img)+'\')"></div><div class="meta"><div class="title"></div></div>';
      b.querySelector(".title").textContent=it.title;
      b.addEventListener("click",function(){openItem(it,f,n);});g.appendChild(b);
    });
  });
  function seqFor(f){
    var out=[];
    D.items[f].forEach(function(it,n){
      if(it.deck){ D.decks[it.deck].forEach(function(x){ out.push(x.live?{proto:true,cap:it.title+" · "+x.cap,item:n}:{src:x.src,cap:it.title+" · "+x.cap,item:n}); }); }
      else if(it.proto){ out.push({proto:true,cap:it.title,item:n}); }
      else { out.push({src:it.img,cap:it.title,item:n}); }
    });
    return out;
  }
  function render(){
    stage.innerHTML="";var s=seq[i];
    if(s.proto){var fr=document.createElement("iframe");fr.src="proto.html#compare";fr.title="Live prototype";stage.appendChild(fr);}
    else{var im=document.createElement("img");im.src=s.src;im.alt=s.cap||"";stage.appendChild(im);}
    count.textContent=s.cap+"  ·  "+(i+1)+" / "+seq.length; prev.disabled=i===0; next.disabled=i===seq.length-1;
  }
  function openItem(it,f,n){
    seq=seqFor(f); i=0; for(var k=0;k<seq.length;k++){ if(seq[k].item===n){ i=k; break; } }
    V.classList.add("on");render();if(V.requestFullscreen)V.requestFullscreen().catch(function(){});
  }
  function close(){V.classList.remove("on");stage.innerHTML="";if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});}
  bar.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.p==="prev"){i=Math.max(0,i-1);render();}else if(b.dataset.p==="next"){i=Math.min(seq.length-1,i+1);render();}else close();});
  window.addEventListener("message",function(){});document.addEventListener("keydown",function(e){if(!V.classList.contains("on"))return;if(e.key==="Escape"){close();return;}if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();i=Math.min(seq.length-1,i+1);render();}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();i=Math.max(0,i-1);render();}});
  document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&V.classList.contains("on"))close();});
})();
</script></body></html>

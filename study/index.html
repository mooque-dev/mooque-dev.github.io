</style></head><body><div class="wrap">

<script>
(function(){
  var cur="tw";
  function fit(box){var i=box.querySelector(".live-in");if(!i)return;var w=box.clientWidth,h=box.clientHeight;if(!w)return;var s=Math.min(w/1280,h/720);i.style.transform="scale("+s+")";i.style.left=((w-1280*s)/2)+"px";i.style.top=((h-720*s)/2)+"px";}
  var boxes=[].slice.call(document.querySelectorAll("[data-live]"));
  if(window.ResizeObserver){var ro=new ResizeObserver(function(es){es.forEach(function(e){fit(e.target);});});boxes.forEach(function(b){ro.observe(b);});}
  window.addEventListener("resize",function(){boxes.forEach(fit);});
  document.querySelectorAll(".tabs [data-t]").forEach(function(b){b.addEventListener("click",function(){cur=b.dataset.t;document.querySelectorAll(".tabs [data-t]").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false");});document.querySelectorAll("[data-pane]").forEach(function(p){p.hidden=p.dataset.pane!==cur;});setTimeout(function(){boxes.forEach(fit);},30);});});
  var P=document.querySelector(".pres"),stage=P.querySelector(".stage"),count=P.querySelector(".bar span"),figs=[],i=0,moved=null,home=null;
  function putBack(){if(moved&&home){home.parentNode.insertBefore(moved,home);home.remove();}moved=null;home=null;}
  function show(n){i=Math.max(0,Math.min(figs.length-1,n));putBack();stage.innerHTML="";var f=figs[i],live=f.querySelector("[data-live]");
    if(live){home=document.createComment("l");live.parentNode.insertBefore(home,live);stage.appendChild(live);moved=live;setTimeout(function(){fit(live);},30);}
    else{var im=document.createElement("img");im.src=f.querySelector("img").getAttribute("src");stage.appendChild(im);}
    var c=f.querySelector("figcaption");count.textContent=c?c.textContent.split(" · ")[0]:"";}
  function open(){figs=[].slice.call(document.querySelectorAll('[data-pane="'+cur+'"] figure.slide'));P.classList.add("on");show(0);if(P.requestFullscreen)P.requestFullscreen().catch(function(){});}
  function close(){putBack();P.classList.remove("on");if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});boxes.forEach(fit);}
  document.querySelector(".present").addEventListener("click",open);
  P.querySelector(".bar").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.p==="prev")show(i-1);else if(b.dataset.p==="next")show(i+1);else close();});
  document.addEventListener("keydown",function(e){if(!P.classList.contains("on"))return;if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();show(i+1);}else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();show(i-1);}else if(e.key==="Escape")close();});
  document.addEventListener("fullscreenchange",function(){if(!document.fullscreenElement&&P.classList.contains("on"))close();});
  boxes.forEach(fit);
})();
</script></body></html>

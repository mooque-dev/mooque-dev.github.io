<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>What I saw in research changed what I built</title>
<style>
:root{color-scheme:light;--fg:#111214;--muted:#6b6e76;--line:#e4e4e8;--blue:#0060d0;--card:#f4f4f6}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#fff;color:var(--fg);font:16px/1.4 -apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;place-items:center}
.slide{width:min(1240px,100%);padding:clamp(20px,4vw,56px)}
h1{font-size:clamp(20px,2.6vw,34px);font-weight:500;letter-spacing:-.01em;margin:0 0 clamp(18px,3.4vw,44px)}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:0 clamp(16px,4vw,56px)}
.cols{color:var(--muted);font-size:clamp(13px,1.5vw,19px);margin:0 0 6px;padding:0 12px}
.rows{list-style:none;margin:0;padding:0;display:grid}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:0 clamp(16px,4vw,56px);width:100%;padding:clamp(8px,1.25vw,16px) 12px;border-radius:10px;font-size:clamp(15px,1.95vw,25px);line-height:1.25;cursor:default;transition:background .15s,opacity .15s}
.row b{color:var(--blue);font-weight:600}
.rows.live .row{opacity:.38}.rows.live .row.on{opacity:1;background:var(--card)}
.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:clamp(14px,2vw,26px) 12px 0}
.peek{position:fixed;left:0;top:0;z-index:9;background:#fff;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 44px rgba(20,20,40,.22);overflow:hidden;pointer-events:none;opacity:0;transform:translate3d(-999px,-999px,0) scale(.97);transition:opacity .14s ease}
.peek.on{opacity:1}
.peek{width:min(760px,90vw,max(420px,calc((50vh - 175px)*3.2)));display:grid;grid-template-columns:1fr 1fr}
.pane{min-width:0;display:flex;flex-direction:column}.pane+.pane{border-left:1px solid var(--line)}
.pane h2{margin:0;padding:9px 12px 8px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}.pane.after h2{color:var(--blue)}
.shot{position:relative;aspect-ratio:16/10;background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top left}
.shot .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;padding:0 20px;text-align:center}
.peek p{margin:0;padding:10px 12px 12px;font-size:13px;line-height:1.35}.peek p span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
@media (max-width:640px){.cols{display:none}.row{grid-template-columns:1fr;gap:4px}.peek{width:min(340px,88vw);grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.row,.peek{transition:none}}
</style></head><body>
<main class="slide">
<h1>What I saw in research changed what I built</h1>
<div class="cols" aria-hidden="true"><span>What we saw</span><span>What we built</span></div>
<ul class="rows" id="rows"></ul>
<p class="hint" id="hint">Hover a row to see the screen before and the screen after, side by side.</p>
</main>
<div class="peek" id="peek" aria-hidden="true"></div>
<script>
(function(){
  var REB="Shipped flow, rebuilt with sample data", OLD="Old flow, rebuilt with sample data", ORIG="From my original design file";
  var R=[
    ["All 8 people kept a side spreadsheet to track the split","The split lives in Keela, with a running total",
      ["img/rs/b1.jpg","One $200 payment became three separate records, matched up by hand.",OLD],
      ["img/rs/1.jpg","Every part of the payment sits on one screen, and a bar keeps the running total.","From the live prototype, sample data"]],
    ["Errors stayed invisible until the final report","The total checks itself; Next unlocks only when it adds up",
      ["img/rs/b2.jpg","The pop-up took any amount as one type. Nothing checked it against the payment.",OLD],
      ["img/rs/2.jpg","$50 is still unplaced, so the bar flags it and Save stays locked.","From the live prototype, sample data"]],
    ["Many people doing the books weren’t accountants","Plain labels: receiptable or not, and a receipt preview",
      ["img/rs/b3.jpg","The very first choice was an accounting one: Donation or Other Revenue.",OLD],
      ["img/rs/3.jpg","Plain labels, a gift or got something back, and a check before saving that shows what goes on the receipt.","From the live prototype, sample data"]],
    ["Receipt rules differ by country","The right fields appear for each part of the payment",
      ["img/rs/b5.jpg","One pop-up, with the same fields for the whole payment.",OLD],
      ["img/rs/5.gif","The same $200 payment under Canada, US and Australia rules: the receipt changes with each country.","From the live prototype, sample data"]],
    ["People think “what was it” before “whose was it”","Details view puts the items first",
      ["img/rs/b6.jpg","Each part was its own record in a pop-up, so no single page showed the whole payment.",OLD],
      ["img/rs/6.jpg","The saved payment opens on its items: what each part was, then the rest.","From the live prototype, sample data"]]
  ];
  var rows=document.getElementById("rows"),peek=document.getElementById("peek"),cur=-1,pinned=false;
  R.forEach(function(r,i){
    var li=document.createElement("li"),b=document.createElement("button");b.type="button";b.className="row";b.dataset.i=i;
    var a=document.createElement("span"),c=document.createElement("b");a.textContent=r[0];c.textContent=r[1];b.appendChild(a);b.appendChild(c);
    li.appendChild(b);rows.appendChild(li);
    [r[2][0],r[3][0]].forEach(function(u){if(u){var im=new Image();im.src=u;}});
  });
  function show(i){
    if(i===cur)return;cur=i;
    [].forEach.call(rows.querySelectorAll(".row"),function(b,k){b.classList.toggle("on",k===i);});
    rows.classList.toggle("live",i>=0);
    if(i<0){peek.classList.remove("on");return;}
    var r=R[i];peek.innerHTML="";
    [["Before",r[2],"before"],["After",r[3],"after"]].forEach(function(x){
      var v=x[1],pn=document.createElement("div");pn.className="pane "+x[2];
      var h=document.createElement("h2");h.textContent=x[0];pn.appendChild(h);
      var sh=document.createElement("div");sh.className="shot";
      if(v[0]){var im=document.createElement("img");im.src=v[0];im.alt="";sh.appendChild(im);}else{var d=document.createElement("div");d.className="none";d.textContent="No screen yet";sh.appendChild(d);}
      pn.appendChild(sh);
      var p=document.createElement("p");p.textContent=v[1];if(v[2]){var sp=document.createElement("span");sp.textContent=v[2];p.appendChild(sp);}pn.appendChild(p);
      peek.appendChild(pn);
    });
    peek.classList.add("on");
  }
  function place(x,y,b){
    var w=peek.offsetWidth,h=peek.offsetHeight,vw=window.innerWidth,vh=window.innerHeight,r=b.getBoundingClientRect();
    var px=Math.max(10,Math.min(vw-w-10,x-w*.5)),py=r.bottom+10;if(py+h>vh-10)py=r.top-h-10;if(py<10)py=(vh-r.bottom>r.top)?Math.max(10,vh-h-10):10;
    peek.style.transform="translate3d("+Math.round(px)+"px,"+Math.round(py)+"px,0)";
  }
  rows.addEventListener("pointermove",function(e){if(e.pointerType==="touch")return;var b=e.target.closest(".row");if(!b)return;pinned=false;show(+b.dataset.i);place(e.clientX,e.clientY,b);});
  rows.addEventListener("pointerleave",function(e){if(e.pointerType==="touch"||pinned)return;show(-1);});
  rows.addEventListener("focusin",function(e){var b=e.target.closest(".row");if(!b||!b.matches(":focus-visible"))return;pinned=true;show(+b.dataset.i);var r=b.getBoundingClientRect();place(r.left+r.width*.5,r.bottom,b);});
  rows.addEventListener("focusout",function(){if(pinned){pinned=false;show(-1);}});
  rows.addEventListener("click",function(e){var b=e.target.closest(".row");if(!b)return;if(e.detail&&!matchMedia("(hover:none)").matches)return;var i=+b.dataset.i,r=b.getBoundingClientRect();
    if(pinned&&cur===i){pinned=false;show(-1);return;}pinned=true;show(i);place(r.left+r.width*.5,r.bottom,b);});
  if(matchMedia("(hover:none)").matches)document.getElementById("hint").textContent="Tap a row to see the screen before and the screen after.";
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&cur>=0){pinned=false;show(-1);return;}
    if(window.parent!==window&&["ArrowLeft","ArrowRight","PageUp","PageDown","Escape"].indexOf(e.key)>=0){try{window.parent.postMessage({studyKey:e.key},location.origin==="null"?"*":location.origin);}catch(er){}}
  });
})();
</script></body></html>
